[package]
name = "diyime2-service-guest"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
diy-ime2-nodes = { path = "../../..", features = ["custom-guest"] }
serde_json = "1"

[workspace]

[profile.release]
opt-level = "s"
lto = true
strip = "debuginfo"
panic = "abort"