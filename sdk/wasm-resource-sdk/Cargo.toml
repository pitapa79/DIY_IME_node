[package]
name = "diy-ime2-wasm-resource-sdk"
version = "0.1.0"
edition = "2024"
publish = false
description = "Guest-only bounded resource ABI; no Node processing or Host authority"

[features]
default = ["serde"]
serde = ["dep:serde"]
artifact-output = []

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"
